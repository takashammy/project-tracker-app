<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="theme-color" content="#111827" />
</head>
<body>
  <header>
    <h1>Project Tracker</h1>
    <div class="header-actions">
      <button id="syncBtn">Sync</button>
      <button id="settingsBtn">Settings</button>
      <button id="addBtn">+ New</button>
    </div>
  </header>

  <main id="board" class="board"></main>

  <!-- Detail modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button class="close">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <button class="close">&times;</button>
      <h2>Settings</h2>
      <label>GitHub Token (read:contents)</label>
      <input id="tokenInput" type="password" placeholder="ghp_..." />
      <label>Repo (owner/repo)</label>
      <input id="repoInput" value="takashammy/project-tracker" />
      <label>Path</label>
      <input id="pathInput" value="projects.json" />
      <button id="saveSettings">Save</button>
      <p class="hint">Token is stored only in your browser. Used to auto-pull on open.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
